[package]
name = "kumiho-core"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Rust core for Kumiho: keys, crypto, networking and storage"

[dependencies]
async-trait = "0.1"
futures-executor = "0.3"
hex = "0.4"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.2" }
rand = "0.9"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
