name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14"
      - run: gradle :app:desktopTest :app:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v5
        with:
          name: kumiho-desktop-${{ matrix.os }}
          path: app/build/compose/binaries/main/*/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14"
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: kumiho-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace
