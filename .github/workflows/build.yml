name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: ${{ !contains(github.event.head_commit.message, '[android-only]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14"
      - name: Install protoc
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y protobuf-compiler ;;
            macOS) brew install protobuf ;;
            Windows) choco install -y protoc ;;
          esac
      - run: gradle :app:desktopTest :app:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v5
        with:
          name: kumiho-desktop-${{ matrix.os }}
          path: app/build/compose/binaries/main/*/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: gradle :app:assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ls -l app/build/outputs/apk/debug/
          unzip -lv "$APK" | grep -E '\.so$|AndroidManifest|Archive|files$' || true
          "$TOOLS/aapt2" dump badging "$APK" | head -12 || true
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" | grep -E '\.so|Verification' || true
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v5
        with:
          name: kumiho-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace
